<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VS SERVICES</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A1933">
<style>
:root{--p:#2D8FE6;--pd:#1B6FC2;--navy:#0A1933;--navy2:#13294B;--accent:#4AE290;--bg:#F4F8FD;--c:#fff;--t:#0A1933;--l:#6F8292;--b:#D8E4EE;--ok:#2E7D32;--er:#C62828}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Roboto,Arial;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.hidden{display:none!important}
.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;font-weight:bold;font-size:18px;position:sticky;top:0;z-index:10;border-bottom:2px solid var(--accent)}
.topbar .back{margin-right:12px;font-size:22px;cursor:pointer}
.lang-toggle{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);padding:6px 10px;border-radius:20px;font-size:12px}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--b);z-index:20;box-shadow:0 -4px 14px rgba(95,168,211,.08)}
.tabbar a{flex:1;text-align:center;padding:10px 0;color:var(--l);font-size:11px;text-decoration:none}
.tabbar a .ic{font-size:18px;display:block;font-weight:700}
.tabbar a.active{color:var(--p)}
.btn{background:var(--p);color:#fff;border:none;padding:14px;border-radius:8px;font-size:15px;font-weight:600;width:100%;cursor:pointer;margin-top:10px}
.btn-out{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn-er{background:var(--er)}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;display:inline-block;margin:0}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:8px;font-size:14px;margin-bottom:8px;background:#fff}
.card{background:#fff;border-radius:10px;padding:14px;margin:10px;box-shadow:0 10px 24px rgba(95,168,211,.06)}
.label{font-weight:bold;margin:14px 10px 6px;color:var(--t)}
.label.inline{margin:10px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;padding:0 10px}
.row>*{flex:1;min-width:120px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--b);background:#fff;font-size:13px;cursor:pointer}
.chip.active{background:var(--p);color:#fff;border-color:var(--p)}
.chip.small{padding:6px 10px;font-size:11px}
.banner{background:#fff;color:var(--t);padding:20px;margin:12px;border-radius:12px;box-shadow:0 16px 30px rgba(62,127,169,.10);border:2px solid #9EC6E1}
.banner h2{font-size:20px}
.banner p{margin-top:6px;opacity:.9;font-size:13px}
.hero-row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-top:12px}
.section{font-size:15px;font-weight:bold;margin:16px 12px 8px;color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 8px}
.quick-grid{grid-template-columns:repeat(2,1fr)}
.action{background:#fff;padding:14px 8px;border-radius:10px;text-align:center;cursor:pointer;border:1px solid var(--b);box-shadow:0 8px 18px rgba(95,168,211,.08)}
.action .ic{font-size:16px;font-weight:700;color:var(--p)}
.action .t{font-size:11px;margin-top:6px;color:var(--t)}
.svc{background:#fff;border-radius:10px;padding:14px;margin:8px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 10px 24px rgba(95,168,211,.06)}
.svc .info{flex:1}
.svc .name{font-weight:600}
.svc .desc{font-size:12px;color:var(--l);margin-top:2px}
.svc .price{color:var(--p);font-weight:bold;margin-top:6px}
.svc-actions{display:flex;flex-direction:column;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
.pcard{background:#fff;border-radius:8px;padding:10px;cursor:pointer}
.pcard .img,.img.big{height:100px;background:#e8f1fb;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;letter-spacing:1px;margin-bottom:8px;color:var(--p)}
.img.big{height:180px}
.pcard .pname{font-weight:600;font-size:13px}
.pcard .price,.price.big{color:var(--p);font-weight:bold;margin-top:4px;font-size:14px}
.pcard .strike{color:var(--l);text-decoration:line-through;font-size:11px;margin-left:4px}
.bk{background:#fff;border-radius:10px;padding:14px;margin:8px 12px;display:flex;cursor:pointer;gap:10px}
.bk .info{flex:1}
.bk .bid{color:var(--p);font-weight:bold;font-size:13px}
.bk .name{font-weight:600;margin-top:4px}
.bk .sub{color:var(--l);font-size:12px;margin-top:2px}
.badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold;color:#fff}
.b-booked{background:#1976D2}.b-confirmed{background:#388E3C}.b-assigned{background:#F57C00}.b-pickup_scheduled{background:#00838F}
.b-in_progress{background:#7B1FA2}.b-completed{background:#2E7D32}.b-cancelled{background:#C62828}
.b-pending{background:#F9A825}.b-paid{background:#2E7D32}.b-failed{background:#C62828}
.empty{text-align:center;color:var(--l);padding:40px}
.empty.small{padding:12px 0}
.login{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 60%,#1C4277 100%);color:#fff;min-height:100vh}
.login .sub{text-align:center;color:#cfe1ee;margin:6px 0 20px;font-size:13px;line-height:1.5}
.login input{background:rgba(255,255,255,.95);color:var(--t);border:none}
.login .label{color:#E8F3FF;margin:6px 0}
.splash-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,#13294B 50%,#1C4277 100%);color:#fff;padding:30px;text-align:center}
.splash-wrap .brand-logo{width:90%;max-width:360px;height:auto;filter:drop-shadow(0 10px 30px rgba(74,226,144,.25))}
.splash-wrap .tag{margin-top:24px;color:var(--accent);letter-spacing:2px;font-size:12px;font-weight:600}
.splash-wrap .loader{margin-top:30px;width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{display:flex;align-items:center}
.brand-logo{width:220px;height:88px;display:block;object-fit:contain}
.brand.compact .brand-logo{width:180px;height:72px}
.toast{position:fixed;bottom:80px;left:20px;right:20px;background:var(--t);color:#fff;padding:12px;border-radius:8px;text-align:center;z-index:100;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fab{position:fixed;bottom:80px;right:20px;background:var(--p);color:#fff;border-radius:30px;padding:14px 22px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:15}
.profile-h{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:30px 20px;text-align:center;border-bottom:3px solid var(--accent)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px;gap:10px}
.stack-list{display:flex;flex-direction:column;gap:12px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini-stat{background:#f5faff;border:1px solid var(--b);border-radius:10px;padding:12px;text-align:center}
.mini-stat b{display:block;font-size:16px;color:var(--p)}
.mini-stat span{font-size:11px;color:var(--l)}
.mini-title{font-weight:700;margin-bottom:10px}
.line-item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--b)}
.line-item:last-child{border-bottom:none}
.muted{color:var(--l);font-size:12px;line-height:1.45}
.amount{font-weight:700;color:var(--p)}
.selectable.selected{border:2px solid var(--p)}
.estimate-box{margin-top:12px;padding:12px;border:1px solid var(--b);border-radius:10px;background:#f8fbff}
.estimate-box .total{font-weight:700}
.timeline-item{padding:10px 0;border-bottom:1px solid var(--b)}
.timeline-item:last-child{border-bottom:none}
.mini-link{display:inline-block;margin-top:6px;color:var(--p);font-size:12px;text-decoration:none;font-weight:600}
@media (max-width:360px){.mini-grid{grid-template-columns:1fr}.hero-row{flex-direction:column}.quick-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
